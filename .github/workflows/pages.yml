name: Deploy Flanguage Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore audio spectra
        id: spectra
        uses: actions/cache@v4
        with:
          path: |
            data/spectra
            data/spectrum-index.js
          key: flanguage-spectra-${{ hashFiles('data/catalog.js', 'scripts/build-spectrum.mjs') }}

      - name: Refresh Bandcamp streams
        run: node scripts/scrape-bandcamp.mjs --include-streams

      - name: Install audio analyzer
        if: steps.spectra.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Analyze frequency spectra
        if: steps.spectra.outputs.cache-hit != 'true'
        run: node scripts/build-spectrum.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
