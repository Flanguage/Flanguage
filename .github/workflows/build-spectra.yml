name: Build audio spectra

on:
  workflow_dispatch:
  push:
    branches:
      - agent/crt-music-player
    paths:
      - scripts/build-spectrum.mjs
      - .github/workflows/build-spectra.yml

permissions:
  contents: write

concurrency:
  group: build-audio-spectra
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Refresh Bandcamp streams
        run: node scripts/scrape-bandcamp.mjs --include-streams

      - name: Analyze frequency spectra
        run: node scripts/build-spectrum.mjs

      - name: Remove expiring stream URLs
        run: node scripts/scrape-bandcamp.mjs

      - name: Commit spectrum data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spectrum-index.js data/spectra
          git commit -m "Generate synchronized audio spectra"
          git push
