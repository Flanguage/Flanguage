name: Generate branch audio fingerprints

on:
  push:
    branches:
      - agent/crt-music-player
    paths:
      - .github/workflows/fingerprints-branch.yml
      - data/catalog.js
      - scripts/build-fingerprints.mjs

permissions:
  contents: write

concurrency:
  group: branch-fingerprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'santismo/Flanguage'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install audio analyzer
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Analyze real track audio
        run: node scripts/build-fingerprints.mjs

      - name: Validate generated fingerprints
        run: |
          node -e 'global.window={};require("./data/fingerprints.js");const values=Object.values(window.FLANGUAGE_FINGERPRINTS.tracks);if(values.length!==271||values.some(value=>value.length!==32)||new Set(values.map(JSON.stringify)).size<200){throw new Error("Fingerprint validation failed");}console.log(`Validated ${values.length} track fingerprints.`)'

      - name: Commit generated fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fingerprints.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate real-audio track fingerprints"
          git push origin "HEAD:${GITHUB_REF_NAME}"
