<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="The complete Flanguage discography in a monochrome terminal."
    >
    <title>Flanguage Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    >
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M12 12h40v8H22v10h24v8H22v14H12z' fill='%23fff'/%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="styles.css?v=3">
  </head>
  <body>
    <main class="terminal" aria-label="Flanguage music terminal">
      <section class="player">
        <div class="player-slot">
          <iframe
            id="bandcamp-player"
            title="Flanguage Bandcamp player"
            loading="eager"
            allow="autoplay"
          ></iframe>
        </div>

        <canvas
          id="spectrum"
          role="img"
          aria-label="Animated monochrome spectrum"
        ></canvas>

        <nav class="transport" aria-label="Playback navigation">
          <button id="previous" type="button" aria-label="Previous track">
            <span class="previous-shape" aria-hidden="true"></span>
          </button>

          <button id="random" type="button" aria-label="Random track">
            <svg
              class="dice"
              viewBox="0 0 40 40"
              role="presentation"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="34" height="34" rx="2"></rect>
              <circle cx="12" cy="12" r="2.5"></circle>
              <circle cx="28" cy="12" r="2.5"></circle>
              <circle cx="20" cy="20" r="2.5"></circle>
              <circle cx="12" cy="28" r="2.5"></circle>
              <circle cx="28" cy="28" r="2.5"></circle>
            </svg>
          </button>

          <button id="next" type="button" aria-label="Next track">
            <span class="next-shape" aria-hidden="true"></span>
          </button>
        </nav>
      </section>

      <section class="directory" aria-label="Track directory">
        <div class="input-row">
          <label class="select-wrap">
            <span class="sr-only">Channel</span>
            <select id="album-filter">
              <option value="all">CH 00 / ALL TRACKS A–Z</option>
            </select>
          </label>

          <label class="search-wrap">
            <span class="prompt" aria-hidden="true">&gt;</span>
            <span class="sr-only">Search tracks</span>
            <input
              id="search"
              type="search"
              inputmode="search"
              placeholder="SEARCH_"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            >
          </label>
        </div>

        <div id="track-list" class="track-list" aria-live="polite"></div>
      </section>
    </main>

    <noscript>
      <p class="noscript">
        JavaScript required.
        <a href="https://flanguage.bandcamp.com">Open Bandcamp.</a>
      </p>
    </noscript>

    <script src="data/catalog.js?v=1"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
