<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="The complete Flanguage discography in a monochrome terminal."
    >
    <title>Flanguage Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    >
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M12 12h40v8H22v10h24v8H22v14H12z' fill='%23fff'/%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="styles.css?v=8">
  </head>
  <body>
    <main class="terminal" aria-label="Flanguage music terminal">
      <header class="mode-switcher">
        <span class="mode-label" aria-hidden="true">PLAYER_MODE:</span>
        <div class="mode-buttons" role="group" aria-label="Player mode">
          <button
            id="terminal-mode"
            class="mode-button active"
            type="button"
            aria-pressed="true"
          >TERMINAL</button>
          <button
            id="winamp-mode"
            class="mode-button"
            type="button"
            aria-pressed="false"
          >WINAMP</button>
        </div>
      </header>

      <section id="terminal-player" class="player">
        <nav class="transport" aria-label="Playback">
          <button
            id="terminal-previous"
            type="button"
            aria-label="Previous track"
          >
            <span class="previous-shape" aria-hidden="true"></span>
          </button>

          <div id="play-host" class="play-host">
            <button id="terminal-play" type="button" aria-label="Play track">
              <span class="play-shape" aria-hidden="true"></span>
            </button>
            <iframe
              id="bandcamp-player"
              title="Flanguage Bandcamp player"
              loading="eager"
              allow="autoplay"
            ></iframe>
          </div>

          <button id="terminal-next" type="button" aria-label="Next track">
            <span class="next-shape" aria-hidden="true"></span>
          </button>
        </nav>
        <audio id="audio" preload="metadata"></audio>

        <div id="seek-row" class="seek-row">
          <output id="elapsed" for="terminal-position">00:00</output>
          <input
            id="terminal-position"
            type="range"
            min="0"
            max="0"
            step="0.01"
            value="0"
            aria-label="Song position"
          >
          <output id="duration" for="terminal-position">00:00</output>
        </div>

        <canvas
          id="spectrum"
          role="img"
          aria-label="Audio-reactive monochrome frequency spectrum"
        ></canvas>

        <div class="random-row">
          <button id="random" type="button" aria-label="Random track">
            <svg
              class="roll-display"
              viewBox="0 0 40 40"
              role="presentation"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="34" height="34" rx="2"></rect>
              <g class="roll-dots"></g>
            </svg>
          </button>
        </div>
      </section>

      <section
        id="winamp-player"
        class="winamp-player"
        aria-label="Archive.org Winamp skin player"
        hidden
      >
        <div class="skin-controls">
          <label class="skin-select-wrap">
            <span>ARCHIVE_SKIN:</span>
            <select id="skin-select" aria-label="Archive.org Winamp skin">
              <option value="winampskin_fear">FEAR</option>
              <option value="winampskin_Winamp_Classic_CM">
                WINAMP CLASSIC [CM]
              </option>
              <option value="winampskins_Aiwa__NSX__S90_3.0">
                AIWA NSX S90
              </option>
              <option value="winampskins_The_Silence_1">
                THE SILENCE
              </option>
              <option value="winampskins_default_2">DEFAULT.WSZ</option>
            </select>
          </label>
          <button id="random-skin" type="button">RANDOM</button>
        </div>

        <div class="skin-url-row">
          <label class="skin-url-wrap">
            <span class="sr-only">Archive.org skin item URL or identifier</span>
            <span class="prompt" aria-hidden="true">&gt;</span>
            <input
              id="skin-url"
              type="url"
              inputmode="url"
              placeholder="PASTE ARCHIVE.ORG SKIN URL_"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            >
          </label>
          <button id="load-skin" type="button">LOAD</button>
        </div>

        <p id="skin-status" class="skin-status" role="status" aria-live="polite">
          WINAMP PLAYER STANDBY_
        </p>
        <audio id="winamp-audio" preload="metadata" playsinline></audio>
        <div id="webamp-host" class="webamp-host">
          <p id="webamp-placeholder" class="webamp-placeholder">
            LOADING WINAMP_
          </p>
        </div>
        <div class="skin-links">
          <a
            id="skin-source"
            href="https://archive.org/details/winampskin_fear"
            target="_blank"
            rel="noopener noreferrer"
          >CURRENT SKIN / ARCHIVE.ORG</a>
          <a
            href="https://archive.org/details/winampskins"
            target="_blank"
            rel="noopener noreferrer"
          >BROWSE SKINS</a>
        </div>
      </section>

      <section
        id="terminal-directory"
        class="directory"
        aria-label="Track directory"
      >
        <div class="input-row">
          <label class="select-wrap">
            <span class="sr-only">Channel</span>
            <select id="album-filter">
              <option value="all">CH 00 / ALL TRACKS A–Z</option>
            </select>
          </label>

          <label class="search-wrap">
            <span class="prompt" aria-hidden="true">&gt;</span>
            <span class="sr-only">Search tracks</span>
            <input
              id="search"
              type="search"
              inputmode="search"
              placeholder="SEARCH_"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            >
          </label>
        </div>

        <div id="track-list" class="track-list" aria-live="polite"></div>
      </section>
    </main>

    <noscript>
      <p class="noscript">
        JavaScript required.
        <a href="https://flanguage.bandcamp.com">Open Bandcamp.</a>
      </p>
    </noscript>

    <script src="bootstrap.js?v=4"></script>
  </body>
</html>
